# 週次: stock-daytrade のシグナルから pattern_weights.json を再計算し、変更があればコミットして push する。
# 要: リポジトリ Settings → Actions → General → Workflow permissions で「Read and write」を許可。
name: pattern-weights

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # 月 15:00 JST 付近（UTC 月曜 06:00）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install TA-Lib C library (Linux)
        run: bash scripts/ci_install_ta_lib.sh

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify TA-Lib import
        run: python -c "import talib; print('TA-Lib OK')"

      - name: Refresh pattern weights
        run: python scripts/update_pattern_weights.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/quadrant_screening/data/pattern_weights.json
          if git diff --staged --quiet; then
            echo "No changes to pattern_weights.json"
          else
            git commit -m "chore: refresh pattern_weights from stock-daytrade signals"
            git push
          fi
